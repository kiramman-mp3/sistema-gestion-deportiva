name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: liga
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: liga_quero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liga -d liga_quero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credenciales descartables del servicio efímero de CI; no son secretos reales.
      DATABASE_URL: postgresql://liga:ci-only-password@localhost:5432/liga_quero
      TEST_DATABASE_URL: postgresql://liga:ci-only-password@localhost:5432/liga_quero_test
      SECURITY_HASH_KEY: ci-only-hash-key-not-a-real-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
